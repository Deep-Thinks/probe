# /etc/nginx/sites-available/probe.niuniu869.com
# 初始仅 80 配置；certbot --nginx 会自动注入 443 + 80→443 跳转。
server {
    listen 80;
    listen [::]:80;
    server_name probe.niuniu869.com;

    # 上传 body 上限：tester 提交反馈很小（~1KB），给 1m 余量
    client_max_body_size 1m;

    # AI worker 评分通常 < 30s，给 60s 富余
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    location / {
        proxy_pass         http://127.0.0.1:19080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # 让 certbot webroot 验证有路径（即便用 --nginx 也保险）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
