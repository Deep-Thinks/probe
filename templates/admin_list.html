<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>反馈列表 · Probe Admin</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="admin-shell">
{{sidebar}}
<main class="admin-main">
  <h1>反馈列表</h1>
  <p class="meta">共 {{total}} 条反馈 · <a href="/admin/export.csv">导出待付清单 CSV ↓</a></p>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>项目</th>
        <th>版本</th>
        <th>提交时间</th>
        <th>AI</th>
        <th>建议</th>
        <th>已确认</th>
        <th>Payout</th>
        <th>风险</th>
        <th>动作</th>
      </tr>
    </thead>
    <tbody>
      {{rows}}
    </tbody>
  </table>
</main>
</div>
</body>
</html>
